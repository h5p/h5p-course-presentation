name: CI

concurrency:
  group: ct-e2e-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    types: [opened, synchronize] # Triggers on PR open and commits to PR
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'

jobs:
  ci:
    uses: h5p/h5p-ci-workflows/.github/workflows/h5p-ci-workflow.yml@master
    with:
      run-translations: true
      run-e2e: true
      e2e-cli-repository: wwalmnes/h5p-cli
      e2e-cli-ref: bff73d9dbd9b7d4e1d3207e0297a68c5afb3e13d
    secrets: inherit